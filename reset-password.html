<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset password | RTU Pasig Academic Services Portal</title>
    <link rel="icon" href="assets/images/rtu-logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" defer></script>
    <script src="js/supabase-config.js" defer></script>
    <script src="js/reset-password.js" defer></script>
  </head>
  <body class="recovery-page">
    <main class="portal-dialog" aria-labelledby="reset-title">
      <header class="modal-header">
        <img src="assets/images/rtu-logo.png" alt="RTU Pasig" width="44" height="44">
        <h1 class="modal-title" id="reset-title">Choose a new password</h1>
      </header>
      <div class="modal-body">
        <form id="reset-password-form" method="post" hidden>
          <div class="mb-3">
            <label class="form-label" for="new-password">New password <span class="label-hint">(8–128 characters)</span></label>
            <input class="dialog-input" id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm-password">Confirm new password</label>
            <input class="dialog-input" id="confirm-password" type="password" autocomplete="new-password" maxlength="128" required>
          </div>
          <button class="primary-button" type="submit">Save new password</button>
        </form>
        <p class="dialog-status" id="reset-status" role="status" aria-live="polite">Checking your reset link…</p>
        <noscript>Enable JavaScript and open the reset link from your email again.</noscript>
      </div>
      <footer class="modal-footer"><a class="text-link" href="./">Return to sign in</a></footer>
    </main>
  </body>
</html>
