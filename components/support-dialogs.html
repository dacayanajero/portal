<body>
<dialog class="portal-dialog support-dialog" id="support-conversation-dialog" aria-labelledby="support-conversation-title"><header class="modal-header"><h3 id="support-conversation-title" tabindex="-1">Support conversation</h3><button class="secondary-button" type="button" id="support-conversation-close">Close conversation</button></header><p id="support-conversation-feedback" role="status" aria-live="polite"></p><div id="support-conversation-body"></div></dialog>
<dialog class="portal-dialog support-confirm-dialog" id="support-confirm-dialog" aria-labelledby="support-confirm-title"><form id="support-confirm-form"><h3 id="support-confirm-title">Confirm support action</h3><p id="support-confirm-summary"></p><label id="support-confirm-reason-label">Remarks or resolution summary (optional)<textarea id="support-confirm-reason" rows="3" maxlength="2000"></textarea></label><p id="support-confirm-feedback" role="alert"></p><div class="support-actions"><button class="secondary-button" type="button" id="support-confirm-cancel">Cancel</button><button class="primary-button" type="submit" id="support-confirm-submit">Confirm</button></div></form></dialog>
<dialog class="portal-dialog support-dialog" id="portal-notifications-dialog" aria-labelledby="portal-notifications-title"><header class="modal-header"><h3 id="portal-notifications-title" tabindex="-1">In-app Notifications</h3><button class="secondary-button" type="button" id="portal-notifications-close">Close notifications</button></header><p class="demo-note">Browser-local updates only. Private support notices are restricted to their authorized recipient; no email or SMS delivery is implied.</p><p id="portal-notifications-feedback" role="status"></p><ul id="portal-notifications-list" class="support-notification-list"></ul></dialog>
</body>
